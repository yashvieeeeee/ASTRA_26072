services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      ASTRA_AUDIT_DB: /data/astra_audit.sqlite3
    volumes:
      - astra_audit:/data
      - ${ASTRA_ARTIFACTS_DIR:-./artifacts}:/app/artifacts:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ASTRA_WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  astra_audit:
